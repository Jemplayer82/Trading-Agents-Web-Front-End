name: CI

on:
  pull_request:
  push:
    branches: [master]
    # NOTE: '**.md' is deliberately NOT ignored — README.md carries TIER:N
    # markers and the TIER-IDENTITY block, so it's generated input to
    # scripts/make_tier.py. A README-only commit must still run tier-check,
    # or a broken marker/identity block lands unvalidated and only detonates
    # at the next tiers.yml dispatch.
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use uv (with the committed uv.lock) so CI reproduces the local env
      # exactly. pytest lives in the [dependency-groups] dev group, which the
      # old `pip install -e ".[web]"` never installed — so the test job had
      # silently failed on every run ("No module named pytest").
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --extra web python -m pytest -q

  # Tier strip check — strips the checkout to each lower tier (scripts/make_tier.py)
  # and re-runs the full lint+test suite against it, catching a feature added
  # without TIER markers or a test that should have been tier-gated but wasn't.
  #
  # KNOWN PRE-EXISTING GAP (unrelated to the tier split): ruff still reports 2
  # residual findings in deploy/memwatch/analyze_memwatch.py (UP015 line 58,
  # B905 line 149) at every tier — out of scope here, tracked separately.
  tier-check:
    name: Tier strip check (tier ${{ matrix.tier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Strip to tier ${{ matrix.tier }}
        run: python scripts/make_tier.py --tier ${{ matrix.tier }} --apply --force

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: Run tests
        run: uv run --extra web python -m pytest -q
