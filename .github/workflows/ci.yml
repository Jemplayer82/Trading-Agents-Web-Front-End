name: CI

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use uv (with the committed uv.lock) so CI reproduces the local env
      # exactly. pytest lives in the [dependency-groups] dev group, which the
      # old `pip install -e ".[web]"` never installed — so the test job had
      # silently failed on every run ("No module named pytest").
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --extra web python -m pytest -q

  # Tier strip check — KNOWN PRE-EXISTING FAILURES (tracked, out-of-scope gap).
  #
  # Tier-stripped trees are currently expected to fail `pytest -q` with 5
  # specific failures and `ruff check .` with 2 specific residual errors in
  # deploy/memwatch/analyze_memwatch.py as of this branch. These failures are
  # pre-existing and were not introduced by the tier-split work.
  #
  # Known failing pytest nodes:
  #   tests/test_alerts.py::TestReaperJob::test_marks_failed_and_alerts
  #   tests/test_features.py::TestTierDefault::test_no_env_uses_default_tier_4
  #   tests/test_features.py::TestTierEnv::test_unknown_tier_falls_back_to_default
  #   tests/test_features.py::TestTierEnv::test_non_numeric_tier_falls_back_to_default
  #   tests/test_schwab_routes_gating.py::TestSchwabRouteGating::test_default_tier_registers_all_schwab_paths
  #
  # Known residual ruff errors:
  #   deploy/memwatch/analyze_memwatch.py: UP015 (line 58)
  #   deploy/memwatch/analyze_memwatch.py: B905 (line 149)
  tier-check:
    name: Tier strip check (tier ${{ matrix.tier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Strip to tier ${{ matrix.tier }}
        run: python scripts/make_tier.py --tier ${{ matrix.tier }} --apply --force

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: Run tests
        run: uv run --extra web python -m pytest -q
