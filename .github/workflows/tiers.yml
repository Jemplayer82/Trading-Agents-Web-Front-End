name: Tier branch regeneration

on:
  workflow_dispatch:
    inputs:
      tiers:
        description: "'all' or comma list e.g. '1,3'"
        required: false
        default: 'all'
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: tiers
  cancel-in-progress: false

jobs:
  tier:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [1, 2, 3]
    steps:
      - name: Determine whether tier ${{ matrix.tier }} is selected
        id: select
        shell: bash
        env:
          TIERS_INPUT: ${{ inputs.tiers }}
          THIS_TIER: ${{ matrix.tier }}
        run: |
          if [ "$TIERS_INPUT" = "all" ] || [ -z "$TIERS_INPUT" ]; then
            run=true
          elif echo ",$TIERS_INPUT," | tr -d ' ' | grep -q ",$THIS_TIER,"; then
            run=true
          else
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.select.outputs.run == 'true'
        with:
          ref: master

      - name: Resolve checked-out master SHA
        if: steps.select.outputs.run == 'true'
        id: master_sha
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.select.outputs.run == 'true'
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Strip to tier ${{ matrix.tier }}
        if: steps.select.outputs.run == 'true'
        run: python scripts/make_tier.py --tier ${{ matrix.tier }} --apply --force

      # Test stripped tree (publish gate). Deliberately no `continue-on-error` —
      # a failure here blocks every step after it (branch push, both image
      # builds), so a broken strip can never publish.
      - name: Test stripped tree (publish gate)
        if: steps.select.outputs.run == 'true'
        run: uv run --extra web python -m pytest -q

      # Pushes made with the default GITHUB_TOKEN do NOT retrigger other
      # workflows — GitHub's built-in loop-prevention skips workflow runs
      # for events generated by the GITHUB_TOKEN/github-actions[bot] actor
      # itself. That's why the image-build steps below live here instead of
      # adding a `tier/**` push trigger to docker.yml: a trigger that fires
      # on THIS push would need a personal access token (PAT) stored as an
      # extra repo secret, which this project intentionally avoids.
      - name: Commit + force-push tier branch
        if: steps.select.outputs.run == 'true'
        env:
          MASTER_SHA: ${{ steps.master_sha.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "tier${{ matrix.tier }}: generated from master@${MASTER_SHA::12} [skip ci]"
          git push --force origin HEAD:tier/${{ matrix.tier }}

      - name: Log in to GitHub Container Registry
        if: steps.select.outputs.run == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.select.outputs.run == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push (tradingagents)
        if: steps.select.outputs.run == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/jemplayer82/tradingagents:tier${{ matrix.tier }}
            ghcr.io/jemplayer82/tradingagents:tier${{ matrix.tier }}-${{ steps.master_sha.outputs.sha }}
          cache-from: type=gha,scope=ghcr.io/jemplayer82/tradingagents
          cache-to: type=gha,mode=min,scope=ghcr.io/jemplayer82/tradingagents

      - name: Build and push (tradingagents-web)
        if: steps.select.outputs.run == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/jemplayer82/tradingagents-web:tier${{ matrix.tier }}
            ghcr.io/jemplayer82/tradingagents-web:tier${{ matrix.tier }}-${{ steps.master_sha.outputs.sha }}
          cache-from: type=gha,scope=ghcr.io/jemplayer82/tradingagents-web
          cache-to: type=gha,mode=min,scope=ghcr.io/jemplayer82/tradingagents-web
